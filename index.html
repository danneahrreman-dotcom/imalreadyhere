<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>I'm Already Here</title>
  <style>
    :root{
      /* hur högt upp texten ska börja – ändra om du vill */
      --top-offset: clamp(32px, 18vh, 200px);
    }

    /* Layout */
    html, body { height: 100%; }
    body {
     min-height: 100svh;
  margin: 0;
  padding: 20px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center; /* ← centrerar vertikalt */

  text-align: center;
  background-color: #0b535c;
  color: #b08e1c;
  font-family: "Gill Sans","Gill Sans MT",Calibri,"Trebuchet MS",sans-serif;
  overflow: hidden;
    }

    /* Typografi – lite mindre */
p {
  font-size: clamp(1rem, 4vw, 2rem);
  line-height: 1.25;
  margin: 0;
    }

    /* Fade-effekter */
    .fade {
      opacity: 0;
      transition: opacity 3s ease 0.5s; /* 3s fade, startar efter 0.5s delay */
    }
    .fade.visible { opacity: 1; }

    /* Byta text utan att hoppa i sidled */
    .swap {
      display: inline-grid;
      position: relative;
      place-items: center;
    }
    .swap .layer {
      grid-area: 1 / 1;
      opacity: 0;
      transition: opacity 3s ease;
      white-space: nowrap;
    }
    .swap .layer.visible { opacity: 1; }

    /* "Sizer" används bara som måttstock och ska inte påverka layouten */
    .sizer {
      position: absolute;
      left: -9999px;
      visibility: hidden;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Rad 2 -->
  <p>
    <span class="swap">
      <span class="sizer">Tvivel finns inte.</span>
      <span id="line2a" class="layer">Hur skulle det vara om det är såhär det ser ut när du är framme?</span>
    </span>
  </p>


  <script>
    const ms = s => s * 1000;

    window.addEventListener("load", () => {

      // 2) Andra raden – in 1s och stanna kvar
      setTimeout(() => {
        const el = document.getElementById("line2a");
        if (el) el.classList.add("visible");
      }, ms(1));

    });
  </script>
</body>
</html>
